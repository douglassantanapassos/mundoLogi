<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Lógi - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <!-- Lado Esquerdo: Logo -->
        <div class="logo-container">
            <a href="index.html"><img src="assets/logo.png" alt="Mundo Lógi Logo" class="logo"></a>
        </div>

        <!-- Lado Direito: Formulário de Login -->
        <div class="form-wrapper">
            <div class="form-box">
                <h2>Login</h2>
                <form id="form-login">
                    <input type="email" placeholder="E-mail" required>
                    <input type="password" placeholder="Senha" required>
                </form>
            </div>
            <!-- O botão fica fora da caixa azul clara, conforme a imagem -->
            <button type="submit" form="form-login" class="btn-submit">Entrar</button>
            <a href="/cadastro" class="link-nav">Não possui conta? Cadastrar</a>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
