<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Lógi - Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-menu">
        <button id="btn-config">Configuração</button>
        <button id="btn-sair">Sair</button>
    </header>

    <main class="container">
        <div class="coluna-esq">
            <img src="logo.png" alt="Mundo Lógi Logo" class="logo">
            <button id="btn-jogar" class="btn-jogar">Jogar</button>
        </div>
        
        <div class="coluna-dir">
            <img src="img_ilustrativa.png" alt="Pilares do Pensamento Computacional" class="ilustrativa">
        </div>
    </main>

    <footer class="footer-menu">
        <button id="btn-som" class="btn-icone">
            <img src="som.png" alt="Ativar/Desativar Som">
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
